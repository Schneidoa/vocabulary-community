  level: B2
  ipa: "/ˈvaɪ.ə/"
  example: "We flew to Sydney via Dubai."
  translations:
    de: ["über", "via"]
  example_translations:
    de: "Wir sind über Dubai nach Sydney geflogen."

- id: "we"
