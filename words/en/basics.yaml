# 👋 Grundlagen – Vokabeln, alphabetisch nach id sortiert.
# Format und Regeln: CONTRIBUTING.md

- id: "address-noun"
  lemma: "address"
  pos: noun
  level: A1
  ipa: "/əˈdres/"
  example: "What is your address?"
  translations:
    de: ["die Adresse"]
  example_translations:
    de: "Wie ist deine Adresse?"

- id: "ah"
  lemma: "ah"
  pos: interjection
  level: A2
  ipa: "/ɑː/"
  example: "Ah, now I understand."
  translations:
    de: ["ah", "ach"]
  example_translations:
    de: "Ach, jetzt verstehe ich."

- id: "all-right-adjective"
  lemma: "all right"
  pos: adjective
  level: A2
  ipa: "/ˌɔːl ˈraɪt/"
  example: "Is everything all right?"
  translations:
    de: ["in Ordnung", "okay"]
  example_translations:
    de: "Ist alles in Ordnung?"

- id: "all-right-interjection"
  lemma: "all right"
  pos: interjection
  level: A2
  ipa: "/ˌɔːl ˈraɪt/"
  example: "All right, let's go."
  translations:
    de: ["in Ordnung", "einverstanden"]
  example_translations:
    de: "In Ordnung, lass uns gehen."

- id: "bye"
  lemma: "bye"
  pos: interjection
  level: A1
  ipa: "/baɪ/"
  example: "Bye, see you later!"
  translations:
    de: ["tschüss"]
  example_translations:
    de: "Tschüss, bis später!"

- id: "excuse-me"
  lemma: "excuse me"
  pos: phrase
  level: A1
  ipa: "/ɪkˈskjuːz miː/"
  example: "Excuse me, where is the station?"
  translations:
    de: ["Entschuldigung", "entschuldigen Sie"]
  example_translations:
    de: "Entschuldigung, wo ist der Bahnhof?"

- id: "good-morning"
  lemma: "good morning"
  pos: phrase
  level: A1
  ipa: "/ɡʊd ˈmɔː.nɪŋ/"
  example: "Good morning, how are you?"
  translations:
    de: ["guten Morgen"]
  example_translations:
    de: "Guten Morgen, wie geht es dir?"

- id: "goodbye"
  lemma: "goodbye"
  pos: interjection
  level: A1
  ipa: "/ˌɡʊdˈbaɪ/"
  example: "Goodbye, see you tomorrow!"
  translations:
    de: ["auf Wiedersehen", "tschüss"]
  example_translations:
    de: "Auf Wiedersehen, bis morgen!"

- id: "hello"
  lemma: "hello"
  pos: interjection
  level: A1
  ipa: "/həˈləʊ/"
  example: "Hello, my name is Tom."
  translations:
    de: ["hallo", "guten Tag"]
  example_translations:
    de: "Hallo, ich heiße Tom."

- id: "hey"
  lemma: "hey"
  pos: interjection
  level: A1
  ipa: "/heɪ/"
  example: "Hey, wait for me!"
  translations:
    de: ["hey", "he"]
  example_translations:
