- id: "ok-adjective"
  lemma: "OK"
  pos: adjective
  level: A1
  ipa: "/ˌəʊˈkeɪ/"
  example: "Is everything OK?"
  translations:
    de: ["okay", "in Ordnung"]
  example_translations:
    de: "Ist alles in Ordnung?"

- id: "ok-interjection"
  lemma: "OK"
  pos: interjection
  level: A1
  ipa: "/ˌəʊˈkeɪ/"
  example: "OK, let's go."
  translations:
    de: ["okay", "einverstanden"]
  example_translations:
