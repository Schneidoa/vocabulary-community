- id: "hi"
  lemma: "hi"
  pos: interjection
  level: A1
  ipa: "/haɪ/"
  example: "Hi, how are you?"
  translations:
    de: ["hallo", "hi"]
  example_translations:
    de: "Hallo, wie geht's?"

- id: "name"
  lemma: "name"
  pos: noun
  level: A1
  ipa: "/neɪm/"
  example: "What is your name?"
  translations:
    de: ["der Name"]
  example_translations:
    de: "Wie ist dein Name?"

- id: "no"
  lemma: "no"
  pos: adverb
  level: A1
  ipa: "/nəʊ/"
  example: "No, I don't know."
  translations:
